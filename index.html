<style>
:root{
  --bg:#0b0b10;--panel:#15151d;--panel2:#1e1e29;--line:#2c2c3b;--text:#f3f3f6;--muted:#9b9bad;
  --gold:#d9b54a;--green:#27c27a;--amber:#f5a623;--red:#ff4d5e;--blue:#3d8bfd;--pink:#ff6fae;--violet:#a98bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:15px}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(11,11,16,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;letter-spacing:.08em;color:var(--gold);font-size:18px}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;margin-left:auto}
.conn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.who{font-size:12px;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo{background:#3a2a00;color:#ffd77a;font-size:12px;text-align:center;padding:6px 10px}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(15,15,22,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;line-height:1}
nav button.on{color:var(--gold)}

main{padding:12px;max-width:1300px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat.alert b{color:var(--red)}

/* table cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-left:5px solid #444;border-radius:14px;padding:10px 11px;min-height:132px;cursor:pointer;transition:transform .08s}
.card:active{transform:scale(.97)}
.ct{display:flex;align-items:center;justify-content:space-between;gap:4px 6px;flex-wrap:wrap}
.ct .setno{margin-right:auto}
/* スタート→終了（5分刻み） */
.span{display:flex;align-items:flex-end;gap:10px;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.span small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.span .arr{color:var(--muted);font-size:.8em}
.span.sm{font-size:17px;gap:6px;margin:2px 0 0;align-items:center}
/* 付け回し履歴 */
.tl{width:100%;border-collapse:collapse;font-size:14px}
.tl td{padding:5px 4px;border-bottom:1px solid var(--line)}
.tl td.s{color:var(--gold);font-weight:800;width:3em}
.tl td.t{color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
/* 付け回しを選ぶ画面：この卓に付いた順 */
.pickhist{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.pickhist>b{width:100%;font-size:12px;color:var(--muted)}
.pickhist .ph{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pickhist .ph i{font-style:normal;font-size:11px;font-weight:800;background:#444;color:#fff;border-radius:99px;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.pickhist .ph.now i{background:var(--gold);color:#000}
.pickhist .ph small{color:var(--muted);font-size:11px}
.pickhist .arr{color:var(--muted)}
.pc em{display:block;font-style:normal;font-size:11px;font-weight:800;color:var(--amber)}
.pc.been{border-color:var(--amber)}
/* 成績 */
.statseg{flex-wrap:wrap}
.rk.stat th.sortable{cursor:pointer;text-decoration:underline dotted}
.rk.stat th.on{color:var(--gold)}
.rk.stat .bar{display:block;height:4px;background:var(--line);border-radius:2px;margin-top:3px;min-width:50px}
.rk.stat .bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.rk.stat tr.tot td{border-top:2px solid var(--line);font-weight:800}
/* フラワー・交渉 */
.flow{display:flex;gap:4px;margin:2px 0;flex-wrap:wrap}
.fl{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;white-space:nowrap}
.fl.done{background:rgba(39,194,122,.2);color:var(--green)}
.fl.todo{background:var(--amber);color:#000;animation:blink 1.2s infinite}
.mt .fl{font-size:.85em;padding:0 4px}
.flowbtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.flowbtns .btn{display:flex;flex-direction:column;align-items:center;font-weight:800}
.flowbtns .btn small{font-weight:400;font-size:11px;color:var(--muted)}
.flowbtns .btn.done{background:rgba(39,194,122,.18);border-color:var(--green);color:var(--green)}
.st-nego{border-left-color:#ff7a2f;background:#2a150a}
.st-nego .badge{background:#ff7a2f;color:#000}
.st-nego .timer,.bigtimer[data-st=nego]{color:#ff7a2f}
.bigtimer[data-st=nego]{color:#ff7a2f}
/* ヘルプ・フリーの名前、席にいない子は薄く */
.c-help{color:var(--violet);font-weight:700}
.c-off{opacity:.45}
.l-help{background:var(--violet);color:#000}
.l-free{background:#fff;color:#000}
.chip.seat.c-help{background:rgba(169,139,255,.15);color:var(--violet);border-color:var(--violet)}
.chip .role{font-size:10px;opacity:.85;margin-right:-2px}
/* お預かり物 */
.l-azu{background:var(--gold);color:#000}
.row.azu{color:var(--gold);font-weight:700}
.azugrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.azugrid .field:last-child{grid-column:1/-1}
.azuwarn{background:#2a2108;border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:8px 12px;margin-top:10px;font-weight:700}
/* 本日の出勤 */
.shiftbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.shiftbar span{color:var(--gold);font-weight:800}
.shiftbar .btn{margin-left:auto}
.shiftwarn{display:flex;align-items:center;gap:10px;background:#2a2108;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:8px 12px;margin:0 0 10px;font-weight:700}
.shiftwarn .btn{margin-left:auto}
.tname{font-weight:800;font-size:18px}
/* 何セット目か（最初のセット＝1、延長・ハーフ延長ごとに+1） */
.setno{display:inline-block;font-weight:800;font-size:13px;padding:1px 8px;border-radius:99px;background:#2c2c3b;color:#ddd;white-space:nowrap}
.setno.more{background:var(--gold);color:#000}
.setno small{font-size:.8em;margin-left:2px}
.mt .setno{font-size:1.05em;padding:0 6px;flex-shrink:0}
.mt.sub .setno{font-size:.85em}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:#333;color:#ddd;white-space:nowrap}
.card .timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 0;letter-spacing:.02em}
.card .sub{font-size:11px;color:var(--muted)}
.card .row{font-size:12.5px;margin-top:3px;line-height:1.35;word-break:break-all}
.lbl{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:5px;margin-right:4px;vertical-align:1px}
.l-hon{background:var(--red);color:#fff}
.l-jon{background:var(--blue);color:#fff}
.l-seat{background:var(--violet);color:#000}
.empty-txt{color:#555;font-size:22px;font-weight:700;margin-top:22px;text-align:center}
.st-empty{opacity:.75}
.st-ok{border-left-color:var(--green)}
.st-ok .badge{background:rgba(39,194,122,.2);color:var(--green)}
.st-warn{border-left-color:var(--amber);background:#221a0b}
.st-warn .badge{background:var(--amber);color:#000}
.st-warn .timer{color:var(--amber)}
.st-over{border-left-color:var(--red);background:#2a0e12;animation:blink 1.2s infinite}
.st-over .badge{background:var(--red);color:#fff}
.st-over .timer{color:var(--red)}
.st-check{border-left-color:var(--blue);background:#0d1830}
.st-check .badge{background:var(--blue);color:#fff}
.st-check .timer{color:var(--blue)}
/* table map */
.viewbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.viewbar .seg{flex-wrap:nowrap}
.viewbar .seg button{flex:0 0 auto;min-width:56px;padding:7px 10px}
.viewbar .btn.sm{white-space:nowrap}
.mapwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px}
.map{position:relative;container-type:inline-size;min-width:340px;background:#101018 radial-gradient(circle,#262634 1px,transparent 1px) 0 0/20px 20px;border:1px solid var(--line);border-radius:14px}
.mt,.decor,.ei{position:absolute;border-radius:9px;overflow:hidden}
.mt{background:var(--panel);border:1px solid var(--line);border-left:4px solid #444;padding:3px 5px;cursor:pointer;font-size:clamp(10px,2.1cqw,15px);line-height:1.25}
.mt .mn{display:flex;justify-content:space-between;align-items:center;gap:3px;font-weight:800}
.mt .badge{display:none}
.mt{container-type:inline-size}
.mt .timer{font-weight:800;font-size:clamp(11px,22cqw,30px);font-variant-numeric:tabular-nums;line-height:1.1}
.mt .row{font-size:.92em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt .lbl{font-size:.8em;padding:0 3px;margin-right:2px}
.mt .et{color:#555;font-weight:700;text-align:center;margin-top:.4em}
.decor{background:repeating-linear-gradient(45deg,#181822,#181822 6px,#1f1f2b 6px,#1f1f2b 12px);border:1px dashed #4a4a5a;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(9px,1.8cqw,13px);pointer-events:none}
.ei{background:var(--panel2);border:2px solid var(--gold);touch-action:none;cursor:move;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(10px,2cqw,15px);user-select:none;-webkit-user-select:none}
.ei.dec{border-style:dashed;border-color:#777;color:var(--muted);font-weight:400}
.ei.sel{box-shadow:0 0 0 3px var(--pink);z-index:2}
.rh{position:absolute;right:0;bottom:0;width:20px;height:20px;background:var(--gold);border-radius:6px 0 7px 0;cursor:nwse-resize}
.edbar{background:#2a2410;border:1px solid var(--gold);border-radius:12px;padding:10px;margin-bottom:10px;font-size:13px}
.edbar .chips{margin-top:8px}
.kpi{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 9px;white-space:nowrap}
.kpi b{color:var(--text);font-size:14px}
.kpi.alert b{color:var(--red)}
.mt.sub{border-radius:50%;border-width:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;text-align:center}
.mt.sub .mn{justify-content:center}
.mt.sub .row{display:none}
.mt.sub.st-empty{border-style:dashed;border-color:#6a6a7a;opacity:1}
.mt.sub.st-ok{border-color:var(--green)}
.mt.sub.st-warn{border-color:var(--amber)}
.mt.sub.st-over{border-color:var(--red)}
.mt.sub.st-check{border-color:var(--blue)}
/* 卓の枠：指名卓＝赤（場内が出ても指名卓）／フリー卓で場内あり＝青／フリー＝白 */
:is(.card,.mt,.mt.sub).k-hon{border:3px solid var(--red)}
:is(.card,.mt,.mt.sub).k-jon{border:3px solid var(--blue)}
:is(.card,.mt,.mt.sub).k-free{border:3px solid #fff}
/* キャスト名：本指名＝赤／場内指名＝青／フリーで着席＝白 */
.c-hon{color:var(--red);font-weight:700}
.c-jon{color:#5ea2ff;font-weight:700}
.c-free{color:#fff}
.ei.sub{border-radius:50%}
.rail-top{display:none}
#rotate{display:none}

/* ===== 横画面レイアウト（基本はこちら） ===== */
@media (orientation:landscape){
  body{padding-bottom:0;padding-left:calc(70px + env(safe-area-inset-left))}
  header,.demo{display:none}
  nav{top:0;bottom:0;right:auto;width:calc(70px + env(safe-area-inset-left));flex-direction:column;justify-content:flex-start;gap:2px;border-top:0;border-right:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom) env(safe-area-inset-left)}
  nav button{flex:0 0 auto;padding:10px 0}
  .rail-top{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .rail-top .logo{font-size:16px}
  .rail-top .clock{margin:0;font-size:14px}
  main{max-width:none;padding:8px 10px}
  .viewbar{margin-bottom:6px}
  .map.fit{width:min(100%,calc((100dvh - 66px) * var(--ar)));margin:0 auto}
  /* 卓の詳細は右側に出す（マップを隠さない） */
  .sheet{left:auto;right:0;top:0;bottom:0;width:min(460px,62vw);max-height:none;border-radius:18px 0 0 18px;border-top:0;border-left:1px solid var(--line);margin:0;padding-top:calc(12px + env(safe-area-inset-top))}
  .toasts{top:calc(10px + env(safe-area-inset-top))}
}
@media (orientation:portrait) and (max-width:900px){
  body:not(.np) #rotate{display:flex;position:fixed;inset:0;z-index:100;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
  #rotate p{color:var(--muted);margin:0 0 10px}
  #rotate .btn{width:260px}
}
@keyframes blink{50%{box-shadow:0 0 0 3px rgba(255,77,94,.55)}}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;border-top:1px solid var(--line)}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sh-head h2{margin:0;font-size:22px}
.x{margin-left:auto;font-size:26px;color:var(--muted);padding:0 6px}
.bigtimer{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1}
.bigtimer[data-st=warn]{color:var(--amber)}
.bigtimer[data-st=over]{color:var(--red)}
.bigtimer[data-st=check]{color:var(--blue)}
.meta{text-align:center;color:var(--muted);font-size:13px;margin:2px 0 10px}
.sec{border-top:1px solid var(--line);padding:10px 0}
.sec h3{margin:0 0 7px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3 .add{margin-left:auto}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 6px;font-weight:700;text-align:center}
.btn:active{filter:brightness(1.4)}
.btn.gold{background:var(--gold);color:#000;border-color:var(--gold)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#000}
.btn.wide{width:100%;padding:14px;font-size:16px}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.35;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 6px 6px 12px;font-weight:700;font-size:14px}
.chip.hon{background:rgba(255,77,94,.15);color:var(--red);border:1px solid var(--red)}
.chip.jon{background:rgba(61,139,253,.15);color:#5ea2ff;border:1px solid var(--blue)}
.chip.seat{background:rgba(255,255,255,.08);color:#fff;border:1px solid #fff}
.chip.seat.c-hon{background:rgba(255,77,94,.15);color:var(--red);border-color:var(--red)}
.chip.seat.c-jon{background:rgba(61,139,253,.15);color:#5ea2ff;border-color:var(--blue)}
.chip small{font-weight:400;opacity:.8}
.chip .rm{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.12);font-size:13px;line-height:22px;text-align:center}
.none{color:#555;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:22px;font-weight:700}
.stepper b{min-width:40px;text-align:center;font-size:22px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:64px;padding:10px 4px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.seg button.on{background:var(--gold);color:#000;border-color:var(--gold)}

/* picker */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px;margin-top:8px}
.pc{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 6px;text-align:center;font-weight:700}
.pc small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:2px}
.pc.sel{background:var(--gold);color:#000;border-color:var(--gold)}
.pc.sel small{color:#333}
.pc.busy small{color:var(--pink)}

/* lists */
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;min-width:42px}
.li .m{flex:1;font-size:13.5px;word-break:break-all}
.li .by{color:var(--muted);font-size:11px}
h4{margin:18px 0 8px;font-size:14px;color:var(--gold)}
.castrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.castrow:last-child{border-bottom:0}
.castrow .nm{font-weight:800;font-size:16px;min-width:70px}
.castrow .where{flex:1;font-size:12.5px;line-height:1.5}
.castrow .cnt{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.state{font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.state.free{background:#24323a;color:#8fd3ff}
.state.busy{background:var(--violet);color:#000}
table.rk{width:100%;border-collapse:collapse;font-size:13px}
table.rk th,table.rk td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}

table.rk td.n{text-align:right;font-variant-numeric:tabular-nums}
.search{margin-bottom:10px}

/* login */
.login{max-width:420px;margin:12vh auto 0;padding:20px}
.login h1{color:var(--gold);letter-spacing:.1em;text-align:center;margin:0 0 4px}
.login p{color:var(--muted);text-align:center;font-size:13px;margin:0 0 24px}

.toasts{position:fixed;top:calc(60px + env(safe-area-inset-top));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#262633;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:92vw}
.toast.warn{background:var(--amber);color:#000}
.toast.over{background:var(--red);color:#fff}
.help{font-size:12px;color:var(--muted);margin:4px 0 0}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.card{min-height:150px}}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}

<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
'use strict';
/* ============ 基本ユーティリティ ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const rid = (p='') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const vals = o => o ? (Array.isArray(o) ? o.filter(Boolean) : Object.values(o)) : [];
const keys = o => o ? Object.keys(o).filter(k => o[k]) : [];
const LS = {
  get(k, d) { try { const v = localStorage.getItem('mc2:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mc2:' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('mc2:' + k); } catch (e) {} }
};
function fmtRemain(ms) {
  const neg = ms < 0, s = Math.floor(Math.abs(ms) / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (neg ? '-' : '') + (h ? h + ':' + pad(m) : m) + ':' + pad(ss);
}
function fmtDur(ms) { const m = Math.max(0, Math.floor(ms / 60000)); return Math.floor(m / 60) + ':' + pad(m % 60); }
const normCode = code => code.normalize('NFKC').replace(/\s+/g, '').toLowerCase();
// 端末どうしで同じ店舗を見ているか確認するための短いID
const storeId = code => storeKey(code).slice(4, 8).toUpperCase();
// 店舗コード → 保存先キー（同じコードなら全端末で同じ場所を見る）
function storeKey(code) {
  const h = (str, seed) => {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(14, '0');
  };
  // 全角・大文字の違いで別店舗にならないよう揃える（スマホの自動大文字・全角入力対策）
  const s = 'MC2::' + normCode(code);
  return 'mc2_' + h(s, 1) + h(s, 7) + h(s, 13) + h(s, 29);
}

/* ============ データストア（Firebase / デモ） ============ */
function makeLocalStore(root) {
  const KEY = 'mc2demo:' + root;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  let tree = load();
  const subs = new Set();
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel(KEY) : null;
  const reload = () => { tree = load(); emit(); };
  if (bc) bc.onmessage = reload;
  window.addEventListener('storage', e => { if (e.key === KEY) reload(); });
  const get = p => p.split('/').filter(Boolean).reduce((o, k) => o == null ? undefined : o[k], tree);
  function setIn(p, v) {
    const ks = p.split('/').filter(Boolean); let o = tree;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length - 1];
    if (v === null || v === undefined) delete o[last]; else o[last] = clone(v);
  }
  function emit() { subs.forEach(s => s.cb(clone(get(s.path)) ?? null)); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(tree)); } catch (e) {} if (bc) bc.postMessage(1); emit(); }
  return {
    mode: 'demo',
    now: () => Date.now(),
    on(p, cb) { const s = { path: p, cb }; subs.add(s); setTimeout(() => cb(clone(get(p)) ?? null)); return () => subs.delete(s); },
    set(p, v) { setIn(p, v); save(); return Promise.resolve(); },
    update(p, o) { for (const k in o) setIn(p + '/' + k, o[k]); save(); return Promise.resolve(); },
    push(p, v) { const id = rid(); setIn(p + '/' + id, v); save(); return Promise.resolve(id); },
    incr(p, d) { setIn(p, (get(p) || 0) + d); save(); return Promise.resolve(); },
    // 子キー（営業日）が from〜to の範囲だけを1回読む
    range(p, from, to) { const o = get(p) || {}, r = {}; for (const k in o) if (k >= from && k <= to) r[k] = o[k]; return Promise.resolve(clone(r)); },
    onConn(cb) { cb(true); }
  };
}
function makeFbStore(db, root) {
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  const r = p => db.ref(root + '/' + p);
  const fail = e => toast('保存エラー: ' + e.message, 'over');
  return {
    mode: 'firebase',
    now: () => Date.now() + offset,   // サーバー時刻に補正（全端末でタイマーが揃う）
    on(p, cb) { const ref = r(p); const h = s => cb(s.val()); ref.on('value', h, e => toast('読込エラー: ' + e.message, 'over')); return () => ref.off('value', h); },
    set: (p, v) => r(p).set(v).catch(fail),
    update: (p, o) => r(p).update(o).catch(fail),
    push(p, v) { const ref = r(p).push(); ref.set(v).catch(fail); return Promise.resolve(ref.key); },
    incr: (p, d) => r(p).transaction(v => (v || 0) + d).catch(fail),  // 同時押しでも取りこぼさない
    // 子キー（営業日）が from〜to の範囲だけを1回読む
    range: (p, from, to) => r(p).orderByKey().startAt(from).endAt(to).once('value').then(s => s.val() || {}),
    onConn(cb) { db.ref('.info/connected').on('value', s => cb(!!s.val())); }
  };
}
function loadScript(src) {
  return new Promise((ok, ng) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ng(new Error('読込失敗 ' + src)); document.head.appendChild(s); });
}
async function loadFirebase() {
  const v = '10.12.2', base = 'https://www.gstatic.com/firebasejs/' + v + '/';
  await loadScript(base + 'firebase-app-compat.js');
  await loadScript(base + 'firebase-auth-compat.js');
  await loadScript(base + 'firebase-database-compat.js');
}

/* ============ 状態 ============ */
let DB = null;
const S = { config: null, tables: {}, logs: {}, history: {}, shift: {} };
let shiftEdit = false;   // キャスト画面で出勤を編集中か
let tab = LS.get('tab', 'board');
let sheet = null;        // {tid, pick, form, q}
let curBiz = null, unsubBiz = [];
let online = false;
let staff = LS.get('staff', '');
const alerted = {};      // sid → 最後に通知した段階

// MC2 の実際の席配置（手書きマップを等倍で写したもの・1マス＝図面の約10px）。「″」付きは繁忙時だけ使う分割席
const MC2_TABLES = [
  // 卓は図面の中心位置を保ったまま、タップしやすいよう一回り大きくしている
  ['T1', 'T1', 63.5, 0, 20, 14], ['T2', 'T2', 64.5, 16, 20, 15], ['T2s', 'T2″', 85, 18.5, 13, 11],
  ['T3', 'T3', 85.5, 31.5, 15, 13], ['T3s', 'T3″', 101, 32.5, 10, 12], ['T4', 'T4', 112, 31.5, 19, 13],
  ['T5', 'T5', 113, 54.5, 18, 16], ['T6', 'T6', 95.5, 53, 13, 17], ['T6s', 'T6″', 95.5, 70.5, 13, 9.5],
  ['T7', 'T7', 82.5, 53, 12, 17], ['T7s', 'T7″', 82.5, 70.5, 12, 9.5],
  ['V1', 'V1', 1.5, 6, 13.5, 13], ['V1s', 'V1″', 16, 6, 9.5, 13], ['V2', 'V2', 1.5, 25, 13.5, 13], ['V2s', 'V2″', 16, 25, 9.5, 13],
  ['C1', 'C1', 51, 21, 9, 9], ['C2', 'C2', 40, 21, 9, 9], ['C3', 'C3', 29, 21, 9, 9]
];
const MC2_LAYOUT = () => ({
  w: 131, h: 80,
  items: Object.fromEntries(MC2_TABLES.map(([id, , x, y, w, h]) => [id, { x, y, w, h }])),
  decor: [
    { id: 'dVIP', label: 'VIP', x: 0.5, y: 4, w: 26, h: 35 },
    { id: 'dBY', label: 'バックヤード', x: 30, y: 0.5, w: 31.5, h: 11.5 },
    { id: 'dCT', label: 'カウンター', x: 30, y: 15, w: 29, h: 5 }
  ]
});
const MC2_TABLE_LIST = () => MC2_TABLES.map(([id, name]) => ({ id, name }));
// 名前の末尾が ″ / '' / " / ' で、それを除いた名前の卓があれば「分割席」
function parentOf(t) {
  const m = t.name.match(/^(.+?)(″|''|"|')$/); if (!m) return null;
  const p = C().tables.find(x => x.name === m[1]); return p ? p.id : null;
}
const subsOf = tid => C().tables.filter(t => parentOf(t) === tid);
// 分割席は「繁忙日モード」（全端末共通）がONのとき、または使用中のときだけ表示
const visibleTable = t => !parentOf(t) || sess(t.id) || C().busy;
const DEFAULT_CONFIG = () => ({
  tables: MC2_TABLE_LIST(),
  casts: (DB && DB.mode === 'demo' ? ['あい','みく','れな','ゆな','さき','まりあ','ひな','りこ'] : []).map((n, i) => ({ id: 'c' + (i + 1), name: n, active: true })),
  setOptions: [60, 90, 120],
  extHalf: 30,   // ハーフ延長
  extFull: 60,   // 延長
  warnMin: 10,   // フラワー（残り何分）
  negoMin: 5,    // 交渉（残り何分）
  cutoff: 6,
  layout: MC2_LAYOUT()   // 席配置（座標は w×h のマス目単位）
});
// 系列店からのヘルプ枠（常にキャスト一覧の最後に出る）
const HELP_CASTS = [['h_halo1', 'HALOヘルプ1'], ['h_halo2', 'HALOヘルプ2'], ['h_halo3', 'HALOヘルプ3'], ['h_halo4', 'HALOヘルプ4'],
  ['h_cejour1', 'CEJOURヘルプ1'], ['h_cejour2', 'CEJOURヘルプ2'], ['h_cejour3', 'CEJOURヘルプ3']];
const isHelp = c => c.id.startsWith('h_');
function normConfig(c) {
  const d = DEFAULT_CONFIG();
  return {
    tables: vals(c.tables).length ? vals(c.tables) : d.tables,
    casts: vals(c.casts).filter(x => !isHelp(x)).concat(HELP_CASTS.map(([id, name]) => ({ id, name, active: true }))),
    setOptions: vals(c.setOptions).map(Number).filter(n => n > 0).length ? vals(c.setOptions).map(Number).filter(n => n > 0) : d.setOptions,
    extHalf: +c.extHalf || d.extHalf,
    extFull: +c.extFull || d.extFull,
    warnMin: +c.warnMin || d.warnMin,
    negoMin: +c.negoMin || d.negoMin,
    cutoff: c.cutoff == null ? d.cutoff : +c.cutoff,
    busy: !!c.busy,
    layout: c.layout ? { w: +c.layout.w || 100, h: +c.layout.h || 100, items: c.layout.items || {}, decor: vals(c.layout.decor) } : d.layout
  };
}
// 配置が未設定の卓は、既存の配置の下に自動で並べる
function layoutOf() {
  const L = C().layout, items = { ...L.items };
  const placed = C().tables.filter(t => items[t.id]);
  let y0 = placed.length ? Math.max(...placed.map(t => items[t.id].y + items[t.id].h)) + 2 : 2, i = 0;
  C().tables.forEach(t => { if (!items[t.id]) { items[t.id] = { x: 2 + (i % 4) * 24.5, y: y0 + Math.floor(i / 4) * 19, w: 22, h: 17 }; i++; } });
  const h = Math.max(L.h, ...Object.values(items).map(it => it.y + it.h + 1));
  return { ...L, h, items };
}
const pos = (it, L) => `left:${it.x / L.w * 100}%;top:${it.y / L.h * 100}%;width:${it.w / L.w * 100}%;height:${it.h / L.h * 100}%`;
const C = () => S.config;
const activeCasts = () => C().casts.filter(c => c.active !== false);
const castName = id => { const c = C().casts.find(c => c.id === id); return c ? c.name : '(削除)'; };
const tableName = tid => { const t = C().tables.find(t => t.id === tid); return t ? t.name : '?'; };
const sess = tid => { const s = S.tables[tid]; return s && s.sid ? s : null; };
function bizDate(t) { const d = new Date(t - ((C() ? C().cutoff : 6) * 3600000)); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function stageOf(s, now) {
  if (!s) return 'empty';
  if (s.status === 'check') return 'check';
  const r = s.end - now;
  if (r <= 0) return 'over';
  if (r <= C().negoMin * 60000) return 'nego';
  if (r <= C().warnMin * 60000) return 'warn';
  return 'ok';
}
const STAGE_LABEL = { empty: '空席', ok: '着席中', warn: 'フラワー', nego: '交渉', over: '時間超過', check: '会計中' };
const jonaiList = s => Object.entries(s.jonai || {}).map(([id, j]) => ({ id, ...j })).sort((a, b) => a.at - b.at);
// 延長は1回ずつ記録（k: 'h'=ハーフ延長 / 'f'=延長）
const extList = s => Object.entries(s.exts || {}).map(([id, e]) => ({ id, ...e })).sort((a, b) => a.at - b.at);
const extCount = s => { const l = extList(s); return { h: l.filter(e => e.k === 'h').length, f: l.filter(e => e.k === 'f').length }; };
// 指名が最優先：本指名があれば指名卓、なければ場内の有無で判定
const kindOf = s => keys(s.hon).length ? 'k-hon' : jonaiList(s).length ? 'k-jon' : 'k-free';
// 女の子の使い方：本指名／場内／ヘルプ（指名卓で指名・場内以外に付いている子）／フリー
const roleOf = (s, cid) => s.hon && s.hon[cid] ? 'c-hon' : jonaiList(s).some(j => j.c === cid) ? 'c-jon' : keys(s.hon).length ? 'c-help' : 'c-free';
const ROLE_LABEL = { 'c-hon': '本指名', 'c-jon': '場内', 'c-help': 'ヘルプ', 'c-free': 'フリー' };
const seatCount = s => keys(s.seat).length;
// 今は卓にいない本指名・場内の子は薄く表示
const namesHtml = (s, ids, cls) => ids.map(c => `<span class="${cls(c)} ${s.seat && s.seat[c] ? '' : 'c-off'}">${esc(castName(c))}</span>`).join('、');
const castRows = s => {
  const hon = keys(s.hon), jon = [...new Set(jonaiList(s).map(j => j.c))].filter(c => !(s.hon && s.hon[c]));
  const help = keys(s.seat).filter(c => roleOf(s, c) === 'c-help'), free = keys(s.seat).filter(c => roleOf(s, c) === 'c-free');
  const row = (lbl, cls, ids) => ids.length ? `<div class="row"><span class="lbl l-${cls}">${lbl}</span>${namesHtml(s, ids, () => 'c-' + cls)}</div>` : '';
  return row('本', 'hon', hon) + row('場', 'jon', jon) + row('ヘ', 'help', help) + row('フ', 'free', free);
};
// フラワー（残り10分のお知らせ）・交渉（残り5分）の実施記録。セットごとにやり直す
const markDone = (s, k) => { const m = s.marks && s.marks[k]; return m && m.set === setNo(s).n ? m : null; };
function flowHtml(s, st, short) {
  const show = ['warn', 'nego', 'over'].includes(st) || markDone(s, 'flower') || markDone(s, 'nego');
  if (!show) return '';
  const f = markDone(s, 'flower'), n = markDone(s, 'nego');
  // マップは狭いので1つにまとめる（例：花✓交!）。どちらか未なら点滅
  if (short) return `<div class="flow"><span class="fl ${f && n ? 'done' : 'todo'}">花${f ? '✓' : '!'}交${n ? '✓' : '!'}</span></div>`;
  const chip = (m, name) => `<span class="fl ${m ? 'done' : 'todo'}">${name}${m ? '済 ' + hm(m.at) : '未'}</span>`;
  return `<div class="flow">${chip(f, 'フラワー')}${chip(n, '交渉')}</div>`;
}
// お預かり物：充電（台数）・お召し物（上着の札：アルファベット）・傘（本数、傘立ての卓番号）
const azuList = s => { const a = s.azu || {}; return [a.charge ? `充電${a.charge}` : '', a.coat ? `上着${a.coat}` : '', a.umb ? `傘${a.umb}本(${a.umbT || ''})` : ''].filter(Boolean); };
// 何セット目か：最初のセットが1、延長・ハーフ延長を1回するごとに+1（今がハーフなら「H」）
const setNo = s => { const l = extList(s); return { n: 1 + l.length, half: !!l.length && l[l.length - 1].k === 'h' }; };
const setPill = (s, word = 'セット') => { const x = setNo(s); return `<span class="setno ${x.n > 1 ? 'more' : ''}">${x.n}${word}${x.half ? '<small>H</small>' : ''}</span>`; };
const extText = (h, f, sep = '・') => [h ? 'ハーフ' + h : '', f ? '延長' + f : ''].filter(Boolean).map(x => sep + x).join('');

// 付け回しの記録（c=キャスト, in=付いた時刻, out=抜けた時刻, set=何セット目に付いたか）
const tsukeList = s => Object.entries(s.tsuke || {}).map(([id, e]) => ({ id, ...e })).sort((a, b) => a.in - b.in);
const tsukeEntry = (s, cid, at) => ({ c: cid, in: at, set: setNo(s).n, by: staff });
function seatOn(tid, s, cid) {
  if (s.seat && s.seat[cid]) return;
  DB.set(`tables/${tid}/seat/${cid}`, true);
  DB.push(`tables/${tid}/tsuke`, tsukeEntry(s, cid, DB.now()));
}
function seatOff(tid, s, cid) {
  DB.set(`tables/${tid}/seat/${cid}`, null);
  const open = tsukeList(s).filter(e => e.c === cid && !e.out).pop();
  if (open) DB.set(`tables/${tid}/tsuke/${open.id}/out`, DB.now());
}
// 女の子ごとの成績（1卓につき各1回まで数える）
//  h=本指名の組、f=フリーで付いた（フリー卓・指名卓の枝＝ヘルプを含む）、j=そのうち場内をもらった
function castStats(s) {
  const st = {}, add = (c, k) => { st[c] = st[c] || {}; st[c][k] = 1; };
  keys(s.hon).forEach(c => add(c, 'h'));
  const jon = new Set(jonaiList(s).map(j => j.c));
  new Set([...tsukeList(s).map(e => e.c), ...keys(s.seat), ...jon]).forEach(c => {
    if (s.hon && s.hon[c]) return;
    add(c, 'f'); if (jon.has(c)) add(c, 'j');
  });
  return st;
}
// 本日の出勤（営業日ごと）。未登録の日は全員を対象にする
const shiftSet = () => !!keys(S.shift).length;
const onShift = cid => !shiftSet() || !!S.shift[cid];
const shiftCasts = () => activeCasts().filter(c => onShift(c.id));
// 席の開始は5分刻み：押した時刻に一番近い0分・5分にそろえる
const round5 = t => Math.round(t / 300000) * 300000;

// キャストの現在地（全卓を横断）
function castWhere(cid) {
  const w = { hon: [], jon: [], seat: [] };
  for (const t of C().tables) {
    const s = sess(t.id); if (!s) continue;
    if (s.hon && s.hon[cid]) w.hon.push(t.name);
    if (jonaiList(s).some(j => j.c === cid)) w.jon.push(t.name);
    if (s.seat && s.seat[cid]) w.seat.push(t.name);
  }
  return w;
}

/* ============ 操作 ============ */
function log(tid, msg) { DB.push('logs/' + bizDate(DB.now()), { t: DB.now(), tb: tid ? tableName(tid) : '', msg, by: staff }); }

  seat() {

    keys(f.hon).forEach(c => { s.seat[c] = true; });  // 本指名の子は着席の頭数に入れる
    s.tsuke = {}; keys(s.seat).forEach(c => { s.tsuke[rid('k')] = { c, in: now, set: 1, by: staff }; });
    DB.set('tables/' + tid, s);
    const hn = keys(f.hon).map(castName).join('・');
    log(tid, `着席 ${f.guests}名 ${f.setMin}分 ${hm(start)}〜${hm(s.end)}` + (s.customer ? ` (${s.customer}様)` : '') + (hn ? ` 本指名:${hn}` : ''));

  },

  // --- 着席中 ---

    DB.incr('tables/' + tid + '/end', m * 60000);

    log(tid, `${label} +${m}分`);
    toast(`${tableName(tid)} ${label} +${m}分`);
  },
  undoExt() {
    const tid = sheet.tid, s = sess(tid); if (!s) return;
    const e = extList(s).pop(); if (!e) return;
    const label = e.k === 'h' ? 'ハーフ延長' : '延長';
    if (!confirm(`直前の「${label} +${e.m}分」（${hm(e.at)}）を取り消しますか？\n（押し間違いの訂正用）`)) return;

  check() {

/* ============ 通知（音・バイブ・トースト） ============ */
let actx = null;
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} reqWake(); }
function beep(kind) {
  if (!LS.get('sound', true) || !actx) return;
  const seq = kind === 'over' ? [880, 660, 880, 660] : [740, 990];
  seq.forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; o.type = 'square'; g.gain.value = 0.08;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime + i * 0.22; o.start(t); o.stop(t + 0.16);
  });
}
function toast(msg, kind = '') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), kind ? 6000 : 2500);
}
function notify(tid, st) {
  const msg = st === 'warn' ? `🌸 ${tableName(tid)} 残り${C().warnMin}分 フラワー` : st === 'nego' ? `💬 ${tableName(tid)} 残り${C().negoMin}分 交渉` : `🚨 ${tableName(tid)} 時間超過`;
  toast(msg, st === 'nego' ? 'warn' : st); beep(st);
  try { navigator.vibrate && navigator.vibrate(st === 'over' ? [300, 100, 300, 100, 300] : [200, 100, 200]); } catch (e) {}
}
let wake = null;
async function reqWake() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reqWake(); });

/* ============ 描画 ============ */

function viewBoard() {

    selItem = id; m.querySelectorAll('.ei').forEach(x => x.classList.toggle('sel', x === el)); updateEdInfo();

    return `<button class="pc ${sel(c.id) ? 'sel' : ''} ${w.seat.length ? 'busy' : ''} ${been ? 'been' : ''}" onclick="A.pickCast('${c.id}')">${esc(c.name)}${been}<small>${esc(hint)}</small></button>`;
  }).join('');
}

function todayCounts() {
  const cnt = {};
  const add = (id, k) => { cnt[id] = cnt[id] || { hon: 0, jon: 0 }; cnt[id][k]++; };
  histList().forEach(h => { (h.hon || []).forEach(id => add(id, 'hon')); (h.jon || []).forEach(id => add(id, 'jon')); });
  C().tables.forEach(t => { const s = sess(t.id); if (s && bizDate(s.start) === curBiz) { keys(s.hon).forEach(id => add(id, 'hon')); jonaiList(s).forEach(j => add(j.c, 'jon')); } });
  return cnt;
}

}

/* ---- 成績（女の子ごとの場内率・本指名） ---- */
let statQ = { p: 'month', from: '', to: '' }, statRows = null, statSeq = 0, statErr = '';
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function statRange() {
  const cb = curBiz || bizDate(DB.now());
  const [y, m, d] = cb.split('-').map(Number), today = new Date(y, m - 1, d);
  if (statQ.p === 'day') return [cb, cb];
  if (statQ.p === 'week') { const s = new Date(today); s.setDate(d - ((today.getDay() + 6) % 7)); return [ymd(s), cb]; }  // 月曜はじまり
  if (statQ.p === 'month') return [ymd(new Date(y, m - 1, 1)), cb];
  if (statQ.p === 'last') return [ymd(new Date(y, m - 2, 1)), ymd(new Date(y, m - 1, 0))];
  return [statQ.from || cb, statQ.to || cb];
}
async function loadStat() {
  const [from, to] = statRange(), sum = {}, seq = ++statSeq;
  statRows = null; statErr = ''; renderStat();
  const row = c => sum[c] = sum[c] || { h: 0, f: 0, j: 0, d: 0 };
  const add = st => Object.entries(st || {}).forEach(([c, v]) => { const a = row(c); a.h += v.h || 0; a.f += v.f || 0; a.j += v.j || 0; });
  let n = 0;
  try {
    const [days, shifts] = await Promise.all([DB.range('history', from, to), DB.range('shift', from, to)]);
    Object.values(days).forEach(day => Object.values(day || {}).forEach(h => { if (h.stats) { add(h.stats); n++; } }));
    // 出勤日数：「本日の出勤」に登録された日を数える
    Object.values(shifts).forEach(day => keys(day || {}).forEach(c => row(c).d++));
  } catch (e) { statErr = e.message; renderStat(); return; }
  if (seq !== statSeq) return;  // 途中で期間を切り替えたら古い結果は捨てる
  // 今いる卓も含める（その時点までの実績）
  C().tables.forEach(t => { const s = sess(t.id); if (s) { const b = bizDate(s.start); if (b >= from && b <= to) { add(castStats(s)); n++; } } });
  statRows = { from, to, n, rows: Object.entries(sum).map(([c, a]) => ({ c, ...a, rate: a.f ? a.j / a.f : -1 })) };
  renderStat();
}
const pct = r => r < 0 ? '－' : Math.round(r * 100) + '%';
function viewStat() {
  const seg = [['day', '今日'], ['week', '今週'], ['month', '今月'], ['last', '先月'], ['custom', '期間指定']];
  setTimeout(() => loadStat().catch(e => { statErr = e.message; renderStat(); }));
  return `<div id="statWrap"><div class="seg statseg">${seg.map(([k, l]) => `<button class="${statQ.p === k ? 'on' : ''}" onclick="A.statP('${k}')">${l}</button>`).join('')}</div>
  ${statQ.p === 'custom' ? `<div class="two" style="margin-top:8px"><input type="date" value="${statRange()[0]}" onchange="A.statD('from',this.value)"><input type="date" value="${statRange()[1]}" onchange="A.statD('to',this.value)"></div>` : ''}
  <div id="statBody"></div>
  <p class="help">出勤日数＝キャスト画面の「本日の出勤」に登録された日数。<br>フリー付卓＝本指名以外で付いた卓の数（フリー卓と、指名卓の枝＝ヘルプを含む）。同じ卓に何回付いても1卓。<br>場内率＝場内をもらった卓 ÷ フリー付卓。退店済みの卓と、いま着席中の卓を数えます。</p></div>`;
}
function renderStat() {
  const el = $('#statBody'); if (!el) return;
  if (statErr) { el.innerHTML = `<p class="help" style="color:var(--red)">読み込めませんでした：${esc(statErr)}</p><button class="btn sm gold" onclick="loadStat()">再読み込み</button>`; return; }
  if (!statRows) { el.innerHTML = '<p class="help">集計中…（通信状況により数秒かかります）</p>'; return; }
  const { from, to, n, rows } = statRows, sort = statQ.sort || 'rate';
  rows.sort((a, b) => sort === 'h' ? b.h - a.h || b.rate - a.rate : sort === 'f' ? b.f - a.f : sort === 'd' ? b.d - a.d : b.rate - a.rate || b.f - a.f);
  const tot = rows.reduce((t, r) => ({ h: t.h + r.h, f: t.f + r.f, j: t.j + r.j, d: t.d + r.d }), { h: 0, f: 0, j: 0, d: 0 });
  const th = (k, l) => `<th class="n sortable ${sort === k ? 'on' : ''}" onclick="A.statSort('${k}')">${l}</th>`;
  el.innerHTML = `<div style="display:flex;align-items:center;margin:10px 0 6px"><span style="color:var(--muted);font-size:12px">${from} 〜 ${to}・${n}卓</span><button class="btn sm" style="margin-left:auto" onclick="A.statCsv()">CSV出力</button></div>
  <div class="list"><table class="rk stat"><tr><th>キャスト</th>${th('d', '出勤日数')}${th('h', '本指名')}${th('f', 'フリー付卓')}<th class="n">場内</th>${th('rate', '場内率')}</tr>
  ${rows.map(r => `<tr><td>${esc(castName(r.c))}</td><td class="n">${r.d}日</td><td class="n c-hon">${r.h}</td><td class="n">${r.f}</td><td class="n c-jon">${r.j}</td><td class="n"><b>${pct(r.rate)}</b>${r.f ? `<span class="bar"><i style="width:${Math.round(r.rate * 100)}%"></i></span>` : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="none">この期間の記録はまだありません</td></tr>'}
  ${rows.length ? `<tr class="tot"><td>合計</td><td class="n">${tot.d}日</td><td class="n">${tot.h}</td><td class="n">${tot.f}</td><td class="n">${tot.j}</td><td class="n"><b>${pct(tot.f ? tot.j / tot.f : -1)}</b></td></tr>` : ''}</table></div>`;
}
function histList() { return Object.values(S.history || {}).sort((a, b) => b.out - a.out); }
function viewHist() {

  const extH = hs.reduce((a, h) => a + (+h.extH || 0), 0), extF = hs.reduce((a, h) => a + (+h.extF || 0), 0);

  const rank = activeCasts().map(c => ({ c, n: cnt[c.id] || { hon: 0, jon: 0 } })).filter(x => x.n.hon || x.n.jon).sort((a, b) => (b.n.hon * 100 + b.n.jon) - (a.n.hon * 100 + a.n.jon));

    <div class="stat"><small>退店客数</small><b>${guests}</b></div>
    <div class="stat"><small>ハーフ延長</small><b>${extH}</b></div>
    <div class="stat"><small>延長</small><b>${extF}</b></div>
    <div class="stat"><small>場内指名</small><b>${jonTotal}</b></div></div>
  <div style="display:flex;align-items:center"><span style="color:var(--muted);font-size:12px">営業日 ${curBiz}（${C().cutoff}時切替）</span><button class="btn sm" style="margin-left:auto" onclick="A.csv()">CSV出力</button></div>
  <h4>キャスト別（本日・在店中含む）</h4>
  <div class="list"><table class="rk"><tr><th>キャスト</th><th style="text-align:right">本指名組</th><th style="text-align:right">場内指名</th></tr>
  ${rank.map(r => `<tr><td>${esc(r.c.name)}</td><td class="n">${r.n.hon}</td><td class="n">${r.n.jon}</td></tr>`).join('') || '<tr><td colspan="3" class="none">まだ記録がありません</td></tr>'}</table></div>
  <h4>退店済みテーブル</h4>
  <div class="list">${hs.map(h => `<div class="li"><span class="t">${hm(h.start)}<br>${hm(h.out)}</span><span class="m"><b>${esc(h.table)}</b> ${h.guests}名 ${esc(h.customer || '')} ・滞在${fmtDur(h.out - h.start)}${extText(h.extH, h.extF)}
    ${(h.honN || []).length ? `<br><span class="lbl l-hon">本</span>${esc(h.honN.join('、'))}` : ''}
    ${(h.jonN || []).length ? `<br><span class="lbl l-jon">場</span>${esc(h.jonN.join('、'))}` : ''}
    ${(h.tsukeN || []).length ? `<br><span class="lbl l-seat">付</span>${esc(h.tsukeN.join('、'))}` : ''}
    ${h.azu ? `<br><span class="lbl l-azu">預</span>${esc(h.azu)}（返却確認済）` : ''}
    ${h.memo ? `<br><span class="by">メモ: ${esc(h.memo)}</span>` : ''}</span></div>`).join('') || '<div class="li"><span class="m none">なし</span></div>'}</div>
  <h4>操作ログ（誰が・いつ・何をしたか）</h4>
  <div class="list">${logs.slice(0, 300).map(l => `<div class="li"><span class="t">${hm(l.t)}</span><span class="m">${l.tb ? '<b>' + esc(l.tb) + '</b> ' : ''}${esc(l.msg)}</span><span class="by">${esc(l.by)}</span></div>`).join('') || '<div class="li"><span class="m none">なし</span></div>'}</div>`;
}

function viewSet() {

    <div class="field"><label>交渉の通知（残り何分）</label><input id="s-nego" type="number" value="${c.negoMin}"></div>

  <button class="btn gold wide" onclick="A.saveSettings()">店舗設定を保存</button>

  <p class="help">卓名の最後に「″」を付けると分割席（例：T2″ は T2 の分割席）。分割席は、テーブル画面の「繁忙日モード」をONにすると全端末のマップに出ます（OFFでも親の卓の画面から開けます）。</p>
  <h4>接続</h4>
  <p class="help">モード：${DB.mode === 'demo' ? 'デモ（この端末のみ）' : 'Firebase リアルタイム同期'}<br>同じ「店舗コード」でログインした端末どうしで共有されます。</p>

  <button class="btn wide" style="margin-top:8px" onclick="A.logout()">ログアウト（店舗コードを入れ直す）</button>`;

/* ============ タイマー ============ */
function tickClock() {
  if (!DB) return;
  const d = new Date(DB.now()), c = $('#clock'), c2 = $('#clock2');
  if (c) c.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  if (c2) c2.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function tick() {
  if (!DB || !C()) return;
  tickClock();
  subscribeBiz();
  const now = DB.now();
  let changed = false;
  document.querySelectorAll('[data-timer]').forEach(el => {
    const s = sess(el.dataset.timer); if (!s) return;
    const st = stageOf(s, now);
    el.textContent = fmtRemain(s.end - now);
    el.dataset.st = st;
    const card = el.closest('[data-card]');
    const cls = (card && card.dataset.base || 'card') + ' st-' + st;
    if (card && card.className !== cls) changed = true;
  });
  if (changed) render();  // 段階が変わったらフラワー・交渉の表示も出し直す
  // 段階が変わった瞬間だけ通知（ページを開いた時点の状態では鳴らさない）
  C().tables.forEach(t => {
    const s = sess(t.id); if (!s) return;
    const st = stageOf(s, now), prev = alerted[s.sid];
    if (prev === undefined) { alerted[s.sid] = st; return; }
    if (st !== prev) { alerted[s.sid] = st; if (st === 'warn' || st === 'nego' || st === 'over') notify(t.id, st); }
  });
}
function subscribeBiz() {
  const b = bizDate(DB.now()); if (b === curBiz) return;
  curBiz = b; unsubBiz.forEach(f => f());
  unsubBiz = [
    DB.on('logs/' + b, v => { S.logs = v || {}; if (tab === 'hist') render(); }),
    DB.on('history/' + b, v => { S.history = v || {}; if (tab !== 'board') render(); }),
    DB.on('shift/' + b, v => { S.shift = v || {}; if (tab === 'cast') $('#main').innerHTML = ''; render(); })
  ];
}

/* ============ 起動 ============ */
function viewLogin(err) {
  $('#app').innerHTML = `<div class="login">
    <h1>MC2</h1><p>テーブル管理 ${FIREBASE_CONFIG ? '' : '（デモモード）'}</p>
    <div class="field"><label>店舗コード（黒服全員で同じものを使用）</label><input id="l-code" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(LS.get('code', ''))}" placeholder="8文字以上" oninput="$('#l-id').textContent = normCode(this.value).length >= 8 ? '店舗ID ' + storeId(this.value) : ''">
      <label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px"><input type="checkbox" style="width:auto" onchange="$('#l-code').type = this.checked ? 'text' : 'password'">コードを表示</label>
      <p class="help" id="l-id" style="font-weight:700;color:var(--gold)"></p></div>
    <div class="field"><label>あなたの名前</label><input id="l-name" value="${esc(staff)}" placeholder="例：たかし"></div>
    ${err ? `<p style="color:var(--red);font-size:13px">${esc(err)}</p>` : ''}
    <button class="btn gold wide" onclick="login()">はじめる</button>
    <p class="help" style="margin-top:14px">店舗コードは店の合言葉です。知っている人だけがデータを見られます。推測されにくいものにしてください。</p></div>`;
}
async function login() {
  const code = $('#l-code').value.trim(), name = $('#l-name').value.trim();
  if (normCode(code).length < 8) return viewLogin('店舗コードは8文字以上にしてください');
  if (!name) return viewLogin('名前を入力してください');
  LS.set('code', code); LS.set('staff', name); staff = name;
  unlockAudio();
  boot();
}
async function boot() {
  const code = LS.get('code', '');
  if (!code || !staff) return viewLogin();
  $('#app').innerHTML = '<div class="login"><h1>MC2</h1><p>接続中…</p></div>';
  const root = 'stores/' + storeKey(code);
  try {
    if (FIREBASE_CONFIG) {
      await loadFirebase();
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      await firebase.auth().signInAnonymously();
      DB = makeFbStore(firebase.database(), root);
    } else {
      DB = makeLocalStore(root);
    }
  } catch (e) {
    LS.del('code');
    return viewLogin('接続できませんでした：' + e.message);
  }
  DB.onConn(ok => { online = ok; setConn(); });
  DB.on('config', v => {
    if (!v) { DB.set('config', DEFAULT_CONFIG()); return; }
    S.config = normConfig(v); subscribeBiz(); render();
  });
  DB.on('tables', v => { S.tables = v || {}; render(); });
  setInterval(tick, 1000);
  document.addEventListener('click', unlockAudio, { once: true });
}
boot();
